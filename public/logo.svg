<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%" fill="none">
  <!-- Clean background -->
  <rect width="600" height="420" fill="#ffffff" rx="16" />

  <!-- Authentic Tooth Cusps & Roots -->
  <g id="tooth-emblem">
    <!-- Top-Left Cyan Ribbon Cusp -->
    <path
      d="M 300 125 C 255 120, 190 60, 140 60 C 105 60, 95 105, 108 135 C 115 150, 130 150, 142 140 C 160 122, 190 92, 245 108 C 280 118, 295 130, 300 125 Z"
      fill="#00A0E9"
    />

    <!-- Top-Right Leaf-Green Ribbon Cusp -->
    <path
      d="M 280 90 C 335 70, 420 65, 480 90 C 510 102, 498 145, 472 160 C 445 175, 435 140, 395 112 C 352 85, 295 92, 280 90 Z"
      fill="#4EB846"
    />

    <!-- Bottom-Left Cyan Root Hook -->
    <path
      d="M 175 295 C 180 330, 198 385, 240 385 C 270 385, 282 340, 286 318 C 290 302, 302 306, 298 325 C 286 368, 266 405, 225 405 C 178 405, 162 340, 162 295 C 162 288, 175 288, 175 295 Z"
      fill="#00A0E9"
    />

    <!-- Bottom-Right Leaf-Green Root Hook -->
    <path
      d="M 310 325 C 318 305, 334 308, 338 328 C 350 365, 370 400, 405 400 C 432 400, 444 355, 448 312 C 456 312, 468 316, 468 332 C 460 375, 445 420, 395 420 C 355 420, 330 370, 310 325 Z"
      fill="#4EB846"
    />
  </g>

  <!-- Typography matching exact brand image -->
  <!-- Line 1: Great Star in Royal Navy Blue -->
  <text
    x="300"
    y="225"
    text-anchor="middle"
    fill="#1D2C8C"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-weight="900"
    font-size="64"
    letter-spacing="-1"
  >Great Star</text>

  <!-- Line 2: Dental Supplies Ltd in Bold Slate Black -->
  <text
    x="300"
    y="272"
    text-anchor="middle"
    fill="#111827"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-weight="800"
    font-size="28"
    letter-spacing="0.2"
  >Dental Supplies Ltd</text>
</svg>
