<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="100%" height="100%">
  <!-- Great Star Dental Supplies Ltd Authentic Logo -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;family=Open+Sans:wght@700;800&amp;display=swap');
      .brand-title {
        font-family: 'Montserrat', 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: 64px;
        fill: #1d2c8c;
        letter-spacing: -0.5px;
      }
      .brand-sub {
        font-family: 'Open Sans', 'Arial', sans-serif;
        font-weight: 800;
        font-size: 27px;
        fill: #1e1e1e;
        letter-spacing: 0.2px;
      }
    </style>
  </defs>

  <!-- Stylized Tooth Cusp & Root Elements -->
  <g id="tooth-emblem">
    <!-- Top-Left Cyan Ribbon Cusp -->
    <path
      d="M 252 108 C 215 106, 175 62, 142 62 C 122 62, 120 98, 128 120 C 131 127, 137 130, 145 125 C 158 112, 172 90, 210 98 C 235 102, 246 112, 252 108 Z"
      fill="#00a0e9"
    />

    <!-- Top-Right Leaf-Green Ribbon Cusp -->
    <path
      d="M 230 75 C 275 62, 335 60, 375 75 C 390 82, 385 110, 368 122 C 352 135, 345 110, 315 92 C 285 75, 245 76, 230 75 Z"
      fill="#4eb846"
    />

    <!-- Bottom-Left Cyan Root Hook -->
    <path
      d="M 150 230 C 152 260, 168 300, 192 300 C 215 300, 222 260, 225 245 C 228 238, 235 240, 232 250 C 225 285, 212 318, 185 318 C 155 318, 132 270, 132 230 C 132 222, 150 220, 150 230 Z"
      fill="#00a0e9"
    />

    <!-- Bottom-Right Leaf-Green Root Hook -->
    <path
      d="M 260 255 C 265 245, 275 250, 278 260 C 285 282, 298 305, 318 305 C 335 305, 342 270, 345 240 C 347 232, 362 232, 362 242 C 358 280, 348 318, 312 318 C 285 318, 268 285, 260 255 Z"
      fill="#4eb846"
    />
  </g>

  <!-- Typography matching exact brand image -->
  <!-- Line 1: Great Star -->
  <text x="260" y="195" text-anchor="middle" class="brand-title">Great Star</text>
  
  <!-- Line 2: Dental Supplies Ltd -->
  <text x="260" y="235" text-anchor="middle" class="brand-sub">Dental Supplies Ltd</text>
</svg>
